<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>GL Configuration Studio — development harness</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- The studio draws with Inter; the host page loads it (a shadow root cannot), falling back to the system font. -->
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="/dev/harness.css" />
	</head>
	<body>
		<!-- Development only: stands in for the app shell, which authenticates the user and picks the client. -->
		<header class="devbar" aria-label="Development identity">
			<strong>Dev harness</strong>
			<label>User <select id="dev-user"></select></label>
			<label>Client <select id="dev-tenant"></select></label>
			<span class="note">Identity is injected by the dev proxy; in production the app core sets it.</span>
		</header>
		<gl-app hash-routing></gl-app>
		<script type="module" src="/dev/harness.ts"></script>
	</body>
</html>
