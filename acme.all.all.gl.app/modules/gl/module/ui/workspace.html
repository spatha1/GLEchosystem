<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>GL Ecosystem — workspace (development harness)</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="/dev/harness.css" />
		<style>
			body { margin: 0; }
		</style>

	<body>
		<!-- Development only: stands in for the app shell, which authenticates the user and lists the clients. -->
		<header class="devbar" aria-label="Development identity">

			<label>User <select id="dev-user"></select></label>
			<span class="note">Identity is injected by the dev proxy; in production the app core sets it.</span>

		<gl-workspace hash-routing studio-url="/"></gl-workspace>
		<script type="module" src="/dev/workspace.ts"></script>
	</body>
